<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Posyandu</title>
    <link rel="stylesheet" href="css/booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="booking-wrapper">
        <header class="header-booking">
            <h1>Booking Jadwal Posyandu</h1>
            <p>Pilih data anak dan lengkapi informasi kehadiran</p>
        </header>

        <section class="booking-card">
            <form id="formBooking">
                <div class="grup-input">
                    <label>Pilih Anak</label>
                    <select id="anak" class="input-field">
                        <option value="">Pilih Anak</option>
                        <option value="Budi">Budi</option>
                        <option value="Ani">Ani</option>
                    </select>
                    <small class="error" id="errorAnak"></small>

                </div>
                <div class="grup-input">
                    <label>Jadwal</label>
                    <input type="text" value="Imunisasi Polio & Vitamin A" readonly class="input-field">
                </div>

                <div class="grup-input">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal" class="input-field">
                    <small class="error" id="errorTanggal"></small>
                </div>

                <div class="grup-input">
                    <label>Catatan</label>
                    <textarea id="catatan" class="input-field"></textarea>
                </div>

                <div class="grup-input">
                    <label>Konfirmasi</label>
                    <div class="checkbox">
                        <input type="checkbox" id="konfirmasi">
                        <span>Saya akan hadir</span>
                    </div>
                    <small class="error" id="errorKonfirmasi"></small>

                </div>
                <div class="aksi">
                    <a href="jadwal_posyandu.html" class="btn-batal">Batal</a>
                    <button type="submit" class="btn-submit">Daftar</button>
                </div>
            </form>

        </section>
        <div class="overlay" id="overlay">
            <div class="modal">
                <i class="fa-solid fa-circle-check"></i>
                <h2>Berhasil</h2>
                <p id="hasilText"></p>
                <button onclick="tutupModal()">Tutup</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>

</body>

</html>
