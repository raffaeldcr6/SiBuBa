<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibuba - Registrasi</title>
    <link rel="stylesheet" href="css/login-registrasi.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navigasi">
        <div class="tautan-nav" id="navMenu">
            <a href="index.html" class="tautan">Beranda</a>
            <a href="login.html" class="tautan">Login</a>
        </div>
        <div class="hamburger" id="hamburger">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>

    <section class="registrasi-section">
        <div class="form-container">
            <div class="header-content">
                <img src="image/bumil.png" alt="Logo" class="logo">
                <h2>Registrasi Akun</h2>
                <p class="subtitle">Silahkan isi data diri Anda</p>
            </div>

            <form onsubmit="return register()">

                <div class="input-group">
                    <label for="nik">NIK</label>
                    <input type="text" id="nik" placeholder="Masukkan NIK" required>
                </div>
                <div class="input-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email" required>
                </div>
                <div class="input-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" placeholder="Masukkan alamat" required>
                </div>
                <div class="input-group">
                    <label for="nohp">No HP</label>
                    <input type="text" id="nohp" placeholder="Masukkan nomor HP" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Buat password" required>
                </div>
                <div class="input-group">
                    <label for="confirm">Konfirmasi Password</label>
                    <input type="password" id="confirm" placeholder="Ulangi password" required>
                </div>
                <button type="submit" class="btn-submit">Daftar</button>
                <p class="registrasi-link">
                    Sudah punya akun?
                    <a href="login.html" class="aksen-merah">Login</a>
                </p>

            </form>

        </div>
    </section>
    <script src="js/script.js"></script>
</body>
</html>
