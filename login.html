<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibuba - Login</title>

    <link rel="stylesheet" href="css/login-registrasi.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navigasi">

        <div class="tautan-nav" id="navMenu">
            <a href="index.html" class="tautan">Beranda</a>
            <a href="login.html" class="tautan">Login</a>
        </div>

        <div class="hamburger" id="hamburger">
            <i class="fa-solid fa-bars"></i>
        </div>

    </nav>

    <section class="login-section">

        <div class="form-container">

            <div class="header-content">
                <img src="image/bumil.png" alt="Logo" class="logo">
                <h2>Selamat Datang</h2>
                <p class="subtitle">Silahkan masukkan data untuk masuk</p>
            </div>

            <form onsubmit="return login()">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email" required>
                </div>

                <div class="input-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" placeholder="Masukkan nama" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>

                <div class="form-footer">
                    <label class="remember-me">
                        <input type="checkbox" id="ingat">
                        <span>Ingat saya</span>
                    </label>

                    <a href="#" class="forgot-link">Lupa Password?</a>
                </div>

                <button type="submit" class="btn-submit">Masuk</button>

                <p class="registrasi-link">
                    Belum punya akun?
                    <a href="registrasi.html" class="aksen-merah">Registrasi</a>
                </p>

            </form>

        </div>

    </section>

    <script src="js/script.js"></script>

</body>
</html>
